<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARK — Task Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a2e;
      --bg-card:   #16213e;
      --bg-row:    #0f3460;
      --border:    #2a2a4a;
      --text:      #e0e0e0;
      --text-dim:  #888;
      --text-muted:#555;
      --accent:    #e94560;

      --c-spec:     #3b82f6;
      --c-decision: #8b5cf6;
      --c-review:   #f97316;
      --c-debt:     #ef4444;
      --c-impl:     #22c55e;
      --c-test:     #06b6d4;
      --c-doc:      #6b7280;
      --c-poc:      #eab308;

      --s-done:     #22c55e;
      --s-stable:   #3b82f6;
      --s-progress: #f97316;
      --s-draft:    #6b7280;

      --font-mono: 'Courier New', Courier, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
    }
    .header h1 span { color: var(--accent); }

    .counters {
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .counters strong { color: var(--text); font-size: 20px; margin-right: 4px; }

    .btn-report {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .btn-report:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(233,69,96,0.06);
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 8px 22px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      transition: color 0.15s, border-color 0.15s;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Filters ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    .filters label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .filters select,
    .filters input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      min-width: 120px;
    }
    .filters input { min-width: 200px; }
    .filters select:hover,
    .filters input:hover { border-color: #4a4a7a; }
    .filters select:focus,
    .filters input:focus { border-color: var(--accent); }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      align-self: flex-end;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Table ── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }
    thead th {
      background: var(--bg-card);
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody tr.done { opacity: 0.55; }

    td {
      padding: 10px 12px;
      vertical-align: top;
      line-height: 1.5;
    }

    /* ── Status cell ── */
    .status-check {
      font-size: 16px;
      display: block;
      text-align: center;
    }

    /* ── ID cell ── */
    .task-id {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .badge-spec     { background: rgba(59,130,246,0.2);  color: var(--c-spec); }
    .badge-decision { background: rgba(139,92,246,0.2);  color: var(--c-decision); }
    .badge-review   { background: rgba(249,115,22,0.2);  color: var(--c-review); }
    .badge-debt     { background: rgba(239,68,68,0.2);   color: var(--c-debt); }
    .badge-impl     { background: rgba(34,197,94,0.2);   color: var(--c-impl); }
    .badge-test     { background: rgba(6,182,212,0.2);   color: var(--c-test); }
    .badge-doc      { background: rgba(107,114,128,0.2); color: var(--c-doc); }
    .badge-poc      { background: rgba(234,179,8,0.2);   color: var(--c-poc); }

    .badge-priority-high   { background: rgba(239,68,68,0.2);  color: #ef4444; }
    .badge-priority-medium { background: rgba(234,179,8,0.2);  color: #eab308; }
    .badge-priority-low    { background: rgba(107,114,128,0.12); color: #9ca3af; }

    .badge-sprint {
      background: rgba(255,255,255,0.08);
      color: #a0a0c0;
      font-family: var(--font-mono);
    }

    /* ── Sessions ── */
    .sessions-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .session-item {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .session-tool {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      margin-right: 4px;
    }
    .tool-OC { background: rgba(233,69,96,0.2); color: var(--accent); }
    .tool-CL { background: rgba(251,191,36,0.2); color: #fbbf24; }

    .session-id { color: var(--text-dim); }
    .session-name { color: var(--text-muted); font-style: italic; }

    /* ── Date ── */
    .date-cell {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ── Notes ── */
    .notes-cell {
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-dim);
      font-size: 13px;
    }

    .dash { color: var(--text-muted); }

    /* ── Empty / Error states ── */
    .state-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      color: var(--text-dim);
    }
    .state-box .icon { font-size: 32px; margin-bottom: 12px; }
    .state-box h2 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
    .state-box code {
      display: inline-block;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--c-impl);
      margin-top: 12px;
    }
    .state-box p { margin-top: 8px; font-size: 13px; line-height: 1.6; }

    .empty-row td {
      text-align: center;
      padding: 32px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-dim);
      gap: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ══════════════════════════════════════════
       ROADMAP STYLES
    ══════════════════════════════════════════ */

    /* ── Roadmap toolbar ── */
    .roadmap-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .view-toggle {
      display: flex;
      gap: 2px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px;
    }
    .view-btn {
      padding: 5px 16px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .view-btn:hover { color: var(--text); }
    .view-btn.active { background: var(--accent); color: #fff; }

    /* ── Kanban ── */
    .kanban-board {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
      align-items: flex-start;
    }
    .kanban-board::-webkit-scrollbar { height: 6px; }
    .kanban-board::-webkit-scrollbar-track { background: var(--bg-card); border-radius: 3px; }
    .kanban-board::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .sprint-col {
      min-width: 210px;
      max-width: 210px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      flex-shrink: 0;
    }
    .sprint-col-header {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .sprint-col-id {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .sprint-col-nom {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      margin-top: 2px;
      line-height: 1.3;
    }

    .feature-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 10px;
      margin-bottom: 7px;
    }
    .feature-card:last-child { margin-bottom: 0; }
    .feature-card-id {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
      opacity: 0.7;
      margin-bottom: 3px;
    }
    .feature-card-nom {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
      line-height: 1.35;
    }
    .feature-statuses {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 7px;
    }
    .fs-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 2px;
    }

    /* ── Status badges (roadmap) ── */
    .sbadge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .sbadge-done      { background: rgba(34,197,94,0.18);  color: var(--s-done); }
    .sbadge-stable    { background: rgba(59,130,246,0.18);  color: var(--s-stable); }
    .sbadge-in-progress { background: rgba(249,115,22,0.18); color: var(--s-progress); }
    .sbadge-draft     { background: rgba(107,114,128,0.12); color: #9ca3af; }
    .sbadge-na        { background: transparent; color: var(--text-muted); font-style: italic; font-weight: 400; }

    /* ── Progress bar ── */
    .progress-wrap {
      margin-top: 6px;
    }
    .progress-track {
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    .progress-fill.full { background: var(--s-done); }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* ── Grid (Grille) ── */
    .grid-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .grid-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    .grid-table thead th {
      background: var(--bg-card);
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .grid-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .grid-table tbody tr:last-child { border-bottom: none; }
    .grid-table tbody tr:hover { background: rgba(255,255,255,0.03); }
    .grid-table td {
      padding: 9px 12px;
      vertical-align: middle;
    }
    .grid-feature-id {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      display: block;
      margin-bottom: 2px;
    }
    .grid-feature-nom {
      font-size: 13px;
      color: var(--text);
    }
    .grid-sprint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #a0a0c0;
      background: rgba(255,255,255,0.07);
      padding: 2px 7px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .task-count-cell {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .grid-progress-wrap {
      min-width: 120px;
    }
    .grid-progress-track {
      height: 6px;
      background: rgba(255,255,255,0.07);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 3px;
    }
    .grid-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .grid-progress-fill.full { background: var(--s-done); }
    .grid-progress-label {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .grid-sprint-header {
      background: var(--bg-card);
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
    }
    .grid-sprint-header td {
      padding: 6px 12px;
    }

    /* ══════════════════════════════════════════
       STATS TAB STYLES
    ══════════════════════════════════════════ */

    .stats-kpi-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem 1.6rem;
      flex: 1;
      min-width: 130px;
    }
    .kpi-card .kpi-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .kpi-card .kpi-value.kpi-green  { color: #22c55e; }
    .kpi-card .kpi-value.kpi-orange { color: #f97316; }
    .kpi-card .kpi-value.kpi-red    { color: #e94560; }
    .kpi-card .kpi-value.kpi-cl     { color: #fbbf24; }
    .kpi-card .kpi-value.kpi-oc     { color: #e94560; }
    .kpi-card-cl { border-color: rgba(251,191,36,0.3); }
    .kpi-card-oc { border-color: rgba(233,69,96,0.3); }
    .kpi-card .kpi-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    @media (max-width: 900px) {
      .charts-grid { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      height: 300px;
      position: relative;
    }
    .chart-card-full {
      grid-column: 1 / -1;
      height: 260px;
    }

    .timeline-intro {
      margin-bottom: 14px;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.5;
    }
    .timeline-intro code {
      font-family: var(--font-mono);
      color: var(--text);
    }
    .timeline-chart-card {
      height: 380px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>ARK <span>Task Dashboard</span></h1>
  <div class="counters" id="counters">
    <div><strong id="cnt-total">—</strong> Total</div>
    <div><strong id="cnt-open">—</strong> Open</div>
    <div><strong id="cnt-done">—</strong> Done</div>
    <div><strong id="cnt-blocked">—</strong> Bloqués</div>
    <div><strong id="cnt-rate">—</strong> Complétés</div>
  </div>
  <a href="../../../e2e/reports/html/index.html"
     target="_blank"
     class="btn-report"
     title="Rapport Playwright — make test-api-backend pour le générer, make test-api-report pour l'ouvrir">
    Playwright Report ↗
  </a>
</div>

<!-- Tab bar -->
<div class="tabs">
  <button class="tab-btn active" data-tab="tasks">Tasks</button>
  <button class="tab-btn" data-tab="roadmap">Roadmap</button>
  <button class="tab-btn" data-tab="stats">Stats ✦</button>
  <button class="tab-btn" data-tab="timeline">Timeline ✦</button>
</div>

<!-- ── View: Tasks ── -->
<div id="view-tasks">
  <div class="filters">
    <label>
      Statut
      <select id="f-statut">
        <option value="">Tous</option>
        <option value="open">Open</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
        <option value="blocked">Blocked</option>
      </select>
    </label>
    <label>
      Sprint
      <select id="f-sprint"><option value="">Tous</option></select>
    </label>
    <label>
      Type
      <select id="f-type"><option value="">Tous</option></select>
    </label>
    <label>
      Agent
      <select id="f-agent"><option value="">Tous</option></select>
    </label>
    <label>
      Feature
      <select id="f-feature"><option value="">Toutes</option></select>
    </label>
    <label>
      Priorité
      <select id="f-priority"><option value="">Toutes</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
    </label>
    <label>
      Recherche
      <input type="text" id="f-search" placeholder="nom, notes…" />
    </label>
    <button class="btn-reset" id="btn-reset">Réinitialiser</button>
  </div>
  <div id="main-content">
    <div class="loading"><div class="spinner"></div> Chargement…</div>
  </div>
</div>

<!-- ── View: Stats ── -->
<div id="view-stats" style="display:none">
  <div class="stats-kpi-row">
    <div class="kpi-card">
      <div class="kpi-value" id="stats-total">—</div>
      <div class="kpi-label">Total tickets</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value kpi-green" id="stats-done">—</div>
      <div class="kpi-label">Done</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value kpi-orange" id="stats-open">—</div>
      <div class="kpi-label">Open / In Progress</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value kpi-red" id="stats-blocked">—</div>
      <div class="kpi-label">Bloqués</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" id="stats-rate">—</div>
      <div class="kpi-label">Taux de complétion</div>
    </div>
    <div class="kpi-card kpi-card-cl">
      <div class="kpi-value kpi-cl" id="stats-sessions-cl">—</div>
      <div class="kpi-label">Sessions Claude</div>
    </div>
    <div class="kpi-card kpi-card-oc">
      <div class="kpi-value kpi-oc" id="stats-sessions-oc">—</div>
      <div class="kpi-label">Sessions OpenCode</div>
    </div>
  </div>
  <div class="charts-grid">
    <div class="chart-card"><canvas id="chart-status"></canvas></div>
    <div class="chart-card"><canvas id="chart-agents"></canvas></div>
    <div class="chart-card"><canvas id="chart-sprints"></canvas></div>
    <div class="chart-card"><canvas id="chart-priority"></canvas></div>
    <div class="chart-card chart-card-full"><canvas id="chart-sessions"></canvas></div>
  </div>
</div>

<!-- ── View: Timeline ── -->
<div id="view-timeline" style="display:none">
  <p class="timeline-intro">
    Progression temporelle basée uniquement sur les tickets <code>done</code> avec
    <code>date_resolution</code>.
  </p>
  <div class="chart-card timeline-chart-card">
    <canvas id="chart-timeline"></canvas>
  </div>
</div>

<!-- ── View: Roadmap ── -->
<div id="view-roadmap" style="display:none">
  <div class="roadmap-toolbar">
    <div class="view-toggle">
      <button class="view-btn active" data-view="kanban">Kanban</button>
      <button class="view-btn" data-view="grille">Grille</button>
    </div>
  </div>
  <div id="kanban-view"></div>
  <div id="grid-view" style="display:none"></div>
</div>

<script>
(function () {
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────────
  let allTasks        = [];
  let filtered        = [];
  let roadmapData     = [];   // sprints[]
  let currentTab      = 'tasks';
  let currentRmView   = 'kanban';
  let chartsInitialized = false;
  let timelineInitialized = false;
  let chartInstances  = {};

  const TYPE_COLORS = {
    spec: 'spec', decision: 'decision', review: 'review', debt: 'debt',
    impl: 'impl', test: 'test', doc: 'doc', poc: 'poc'
  };

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const mainContent   = document.getElementById('main-content');
  const cntTotal      = document.getElementById('cnt-total');
  const cntOpen       = document.getElementById('cnt-open');
  const cntDone       = document.getElementById('cnt-done');
  const cntBlocked    = document.getElementById('cnt-blocked');
  const cntRate       = document.getElementById('cnt-rate');
  const fStatut       = document.getElementById('f-statut');
  const fSprint       = document.getElementById('f-sprint');
  const fType         = document.getElementById('f-type');
  const fAgent        = document.getElementById('f-agent');
  const fFeature      = document.getElementById('f-feature');
  const fPriority     = document.getElementById('f-priority');
  const fSearch       = document.getElementById('f-search');
  const btnReset      = document.getElementById('btn-reset');
  const viewTasks     = document.getElementById('view-tasks');
  const viewRoadmap   = document.getElementById('view-roadmap');
  const viewStats     = document.getElementById('view-stats');
  const viewTimeline  = document.getElementById('view-timeline');
  const kanbanView    = document.getElementById('kanban-view');
  const gridView      = document.getElementById('grid-view');

  // ── Tab switching ──────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      viewTasks.style.display   = currentTab === 'tasks'   ? '' : 'none';
      viewRoadmap.style.display = currentTab === 'roadmap' ? '' : 'none';
      viewStats.style.display   = currentTab === 'stats'   ? '' : 'none';
      viewTimeline.style.display = currentTab === 'timeline' ? '' : 'none';
      if (currentTab === 'roadmap') renderRoadmapView();
      if (currentTab === 'stats')   renderStats();
      if (currentTab === 'timeline') renderTimeline();
    });
  });

  // ── Roadmap view toggle ────────────────────────────────────────────────────
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentRmView = btn.dataset.view;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
      kanbanView.style.display = currentRmView === 'kanban' ? '' : 'none';
      gridView.style.display   = currentRmView === 'grille' ? '' : 'none';
    });
  });

  // ── Helpers ────────────────────────────────────────────────────────────────
  function dash(val) {
    if (val === null || val === undefined || val === '' || val === '~') {
      return '<span class="dash">—</span>';
    }
    return String(val);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function truncate(str, max) {
    if (!str) return '';
    const s = String(str);
    return s.length > max ? s.slice(0, max) + '…' : s;
  }

  function uniqueVals(arr, key) {
    const set = new Set();
    arr.forEach(t => {
      const v = t[key];
      if (v !== null && v !== undefined && v !== '' && v !== '~') set.add(v);
    });
    return Array.from(set).sort();
  }

  function populateSelect(sel, values) {
    const first = sel.options[0];
    sel.innerHTML = '';
    sel.appendChild(first);
    values.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
  }

  // ── Progress calculator ────────────────────────────────────────────────────
  function getProgress(featureId) {
    const linked = allTasks.filter(t =>
      t.theme === featureId ||
      (t.feature && typeof t.feature === 'string' && t.feature.startsWith(featureId))
    );
    if (linked.length === 0) return null;
    const done = linked.filter(t => t.statut === 'done').length;
    return { done, total: linked.length, pct: Math.round(done / linked.length * 100) };
  }

  function renderProgressBar(progress, gridMode) {
    if (!progress) return '<span class="dash">—</span>';
    const pct = progress.pct;
    const full = pct === 100 ? ' full' : '';
    if (gridMode) {
      return `
        <div class="grid-progress-wrap">
          <div class="grid-progress-track">
            <div class="grid-progress-fill${full}" style="width:${pct}%"></div>
          </div>
          <div class="grid-progress-label">${progress.done}/${progress.total} — ${pct}%</div>
        </div>`;
    }
    return `
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill${full}" style="width:${pct}%"></div>
        </div>
        <div class="progress-meta">
          <span>${progress.done}/${progress.total}</span>
          <span>${pct}%</span>
        </div>
      </div>`;
  }

  // ── Status badge (roadmap) ─────────────────────────────────────────────────
  const STATUS_LABELS = {
    done: 'Done', stable: 'Stable', 'in-progress': 'En cours', draft: 'Draft'
  };
  function statusBadge(val) {
    if (!val || val === '~') return '<span class="sbadge sbadge-na">N/A</span>';
    const label = STATUS_LABELS[val] || val;
    return `<span class="sbadge sbadge-${val}">${label}</span>`;
  }

  // ── Roadmap renderers ──────────────────────────────────────────────────────
  function renderKanban() {
    if (!roadmapData.length) {
      kanbanView.innerHTML = '<div class="state-box"><div class="icon">📋</div><h2>roadmap.yaml non chargé</h2><p>Servir depuis la racine du projet : <code>npx serve .</code></p></div>';
      return;
    }
    let html = '<div class="kanban-board">';
    roadmapData.forEach(sprint => {
      html += `
        <div class="sprint-col">
          <div class="sprint-col-header">
            <div class="sprint-col-id">${escapeHtml(sprint.id)}</div>
            <div class="sprint-col-nom">${escapeHtml(sprint.nom)}</div>
          </div>`;
      (sprint.features || []).forEach(f => {
        const progress = getProgress(f.id);
        html += `
          <div class="feature-card">
            <div class="feature-card-id">${escapeHtml(f.id)}</div>
            <div class="feature-card-nom">${escapeHtml(f.nom)}</div>
            <div class="feature-statuses">
              <span class="fs-label">B</span>${statusBadge(f.back)}
              &nbsp;
              <span class="fs-label">F</span>${statusBadge(f.front)}
            </div>
            ${renderProgressBar(progress, false)}
          </div>`;
      });
      html += '</div>';
    });
    html += '</div>';
    kanbanView.innerHTML = html;
  }

  function renderGrid() {
    if (!roadmapData.length) {
      gridView.innerHTML = '<div class="state-box"><div class="icon">📋</div><h2>roadmap.yaml non chargé</h2></div>';
      return;
    }
    let html = `
      <div class="grid-wrap">
        <table class="grid-table">
          <thead>
            <tr>
              <th>Feature</th>
              <th>Sprint</th>
              <th>Back</th>
              <th>Front</th>
              <th>Tâches</th>
              <th>Progression</th>
            </tr>
          </thead>
          <tbody>`;

    roadmapData.forEach(sprint => {
      // Sprint separator row
      html += `
        <tr class="grid-sprint-header">
          <td colspan="6">
            <span style="font-family:var(--font-mono);color:var(--accent);margin-right:8px">${escapeHtml(sprint.id)}</span>
            ${escapeHtml(sprint.nom)}
          </td>
        </tr>`;

      (sprint.features || []).forEach(f => {
        const progress = getProgress(f.id);
        const taskCountHtml = progress
          ? `<span class="task-count-cell">${progress.total} tâche${progress.total > 1 ? 's' : ''}</span>`
          : '<span class="dash">—</span>';

        html += `
          <tr>
            <td>
              <span class="grid-feature-id">${escapeHtml(f.id)}</span>
              <span class="grid-feature-nom">${escapeHtml(f.nom)}</span>
            </td>
            <td><span class="grid-sprint">${escapeHtml(sprint.id)}</span></td>
            <td>${statusBadge(f.back)}</td>
            <td>${statusBadge(f.front)}</td>
            <td>${taskCountHtml}</td>
            <td>${renderProgressBar(progress, true)}</td>
          </tr>`;
      });
    });

    html += '</tbody></table></div>';
    gridView.innerHTML = html;
  }

  function renderRoadmapView() {
    renderKanban();
    renderGrid();
    kanbanView.style.display = currentRmView === 'kanban' ? '' : 'none';
    gridView.style.display   = currentRmView === 'grille' ? '' : 'none';
  }

  // ── Tasks renderers ────────────────────────────────────────────────────────
  function renderSessions(sessions) {
    if (!sessions || sessions.length === 0) return '<span class="dash">—</span>';
    return '<div class="sessions-list">' +
      sessions.map(s => {
        const tool = escapeHtml(s.tool || '');
        const id   = escapeHtml(s.id   || '');
        const nom  = escapeHtml(s.nom  || '');
        return `<span class="session-item">` +
          `<span class="session-tool tool-${tool}">${tool}</span>` +
          `<span class="session-id">${id}</span>` +
          (nom ? ` <span class="session-name">"${nom}"</span>` : '') +
          `</span>`;
      }).join('') +
    '</div>';
  }

  function statusIcon(statut) {
    switch (statut) {
      case 'done':        return '✅';
      case 'in_progress': return '🔄';
      case 'blocked':     return '🚫';
      default:            return '⬜';
    }
  }

  function renderRow(task) {
    const isDone    = task.statut === 'done';
    const typeClass = TYPE_COLORS[task.type] ? `badge badge-${task.type}` : 'badge badge-doc';
    const notes     = escapeHtml(task.notes || '');

    const sprintHtml = task.sprint
      ? `<span class="badge badge-sprint">${escapeHtml(task.sprint)}</span>`
      : '<span class="dash">—</span>';
    const typeHtml = task.type
      ? `<span class="${typeClass}">${escapeHtml(task.type)}</span>`
      : '<span class="dash">—</span>';

    const pClass = task.priorité === 'high' ? 'badge-priority-high' : task.priorité === 'low' ? 'badge-priority-low' : 'badge-priority-medium';
    const priorityHtml = task.priorité
      ? `<span class="badge ${pClass}">${escapeHtml(task.priorité)}</span>`
      : '<span class="dash">—</span>';

    return `
      <tr class="${isDone ? 'done' : ''}">
        <td><span class="status-check">${statusIcon(task.statut)}</span></td>
        <td><span class="task-id">${escapeHtml(task.id)}</span></td>
        <td>${escapeHtml(task.nom || '')}</td>
        <td>${sprintHtml}</td>
        <td>${dash(task.theme)}</td>
        <td>${typeHtml}</td>
        <td>${priorityHtml}</td>
        <td>${dash(task.assigned_agent)}</td>
        <td>${dash(task.feature)}</td>
        <td>${renderSessions(task.sessions)}</td>
        <td><span class="date-cell">${dash(task.date_resolution)}</span></td>
        <td class="notes-cell" title="${notes}">${escapeHtml(truncate(task.notes, 60)) || '<span class="dash">—</span>'}</td>
      </tr>`;
  }

  function renderTable(tasks) {
    const rows = tasks.length > 0
      ? tasks.map(renderRow).join('')
      :       `<tr class="empty-row"><td colspan="12">Aucune tâche ne correspond aux filtres.</td></tr>`;

    return `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Statut</th>
              <th>ID</th>
              <th>Nom</th>
              <th>Sprint</th>
              <th>Thème</th>
              <th>Type</th>
              <th>Priorité</th>
              <th>Agent</th>
              <th>Feature</th>
              <th>Sessions</th>
              <th>Résolution</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // ── Counters ───────────────────────────────────────────────────────────────
  function updateCounters(tasks) {
    const total   = tasks.length;
    const done    = tasks.filter(t => t.statut === 'done').length;
    const blocked = tasks.filter(t => t.statut === 'blocked').length;
    cntTotal.textContent   = total;
    cntOpen.textContent    = tasks.filter(t => t.statut === 'open' || t.statut === 'in_progress').length;
    cntDone.textContent    = done;
    cntBlocked.textContent = blocked;
    cntRate.textContent    = total ? Math.round(done / total * 100) + '%' : '—';
  }

  // ── Filter logic ───────────────────────────────────────────────────────────
  function applyFilters() {
    const statut  = fStatut.value;
    const sprint  = fSprint.value;
    const type    = fType.value;
    const agent   = fAgent.value;
    const feature = fFeature.value;
    const priority = fPriority.value;
    const search  = fSearch.value.trim().toLowerCase();

    filtered = allTasks.filter(t => {
      if (statut  && t.statut          !== statut)  return false;
      if (sprint  && t.sprint          !== sprint)  return false;
      if (type    && t.type            !== type)    return false;
      if (agent   && t.assigned_agent  !== agent)   return false;
      if (feature && t.feature         !== feature) return false;
      if (priority && t.priorité       !== priority) return false;
      if (search) {
        const haystack = [t.nom, t.notes, t.id].join(' ').toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    mainContent.innerHTML = renderTable(filtered);
    updateCounters(filtered);
  }

  // ── Stats renderer ────────────────────────────────────────────────────────
  function renderStats() {
    if (chartsInitialized) return;
    chartsInitialized = true;

    const tasks   = allTasks;
    const total   = tasks.length;
    const done    = tasks.filter(t => t.statut === 'done').length;
    const open    = tasks.filter(t => t.statut === 'open' || t.statut === 'in_progress').length;
    const blocked = tasks.filter(t => t.statut === 'blocked').length;
    const rate    = total ? Math.round(done / total * 100) : 0;

    // Sessions par outil
    let clCount = 0, ocCount = 0;
    tasks.forEach(t => (t.sessions || []).forEach(s => {
      if (s.tool === 'CL') clCount++;
      else if (s.tool === 'OC') ocCount++;
    }));

    document.getElementById('stats-total').textContent       = total;
    document.getElementById('stats-done').textContent        = done;
    document.getElementById('stats-open').textContent        = open;
    document.getElementById('stats-blocked').textContent     = blocked;
    document.getElementById('stats-rate').textContent        = rate + '%';
    document.getElementById('stats-sessions-cl').textContent = clCount;
    document.getElementById('stats-sessions-oc').textContent = ocCount;

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#ccc', boxWidth: 12 } } }
    };

    // Chart 1 — Donut statuts
    const statusCounts = { open: 0, in_progress: 0, done: 0, blocked: 0 };
    tasks.forEach(t => { if (t.statut in statusCounts) statusCounts[t.statut]++; });
    chartInstances.status = new Chart(document.getElementById('chart-status'), {
      type: 'doughnut',
      data: {
        labels: ['Open', 'In Progress', 'Done', 'Bloqué'],
        datasets: [{ data: Object.values(statusCounts),
          backgroundColor: ['#4a9eff', '#f39c12', '#2ecc71', '#e94560'],
          borderWidth: 0 }]
      },
      options: { ...chartDefaults,
        plugins: { ...chartDefaults.plugins,
          title: { display: true, text: 'Répartition par statut', color: '#ccc', font: { size: 13 } } } }
    });

    // Chart 2 — Barres par agent (stacked)
    const agents     = [...new Set(tasks.map(t => t.assigned_agent).filter(Boolean))].sort();
    chartInstances.agents = new Chart(document.getElementById('chart-agents'), {
      type: 'bar',
      data: {
        labels: agents,
        datasets: [
          { label: 'Done',    data: agents.map(a => tasks.filter(t => t.assigned_agent === a && t.statut === 'done').length),    backgroundColor: '#2ecc71' },
          { label: 'Open',    data: agents.map(a => tasks.filter(t => t.assigned_agent === a && (t.statut === 'open' || t.statut === 'in_progress')).length), backgroundColor: '#4a9eff' },
          { label: 'Bloqué', data: agents.map(a => tasks.filter(t => t.assigned_agent === a && t.statut === 'blocked').length),  backgroundColor: '#e94560' }
        ]
      },
      options: { ...chartDefaults,
        scales: {
          x: { stacked: true, ticks: { color: '#ccc' }, grid: { color: '#2a2a4a' } },
          y: { stacked: true, ticks: { color: '#ccc', stepSize: 1 }, grid: { color: '#2a2a4a' } }
        },
        plugins: { ...chartDefaults.plugins,
          title: { display: true, text: 'Tickets par agent', color: '#ccc', font: { size: 13 } } } }
    });

    // Chart 3 — Barres par sprint
    const sprints = [...new Set(tasks.map(t => t.sprint).filter(Boolean))].sort();
    chartInstances.sprints = new Chart(document.getElementById('chart-sprints'), {
      type: 'bar',
      data: {
        labels: sprints,
        datasets: [
          { label: 'Done',         data: sprints.map(s => tasks.filter(t => t.sprint === s && t.statut === 'done').length),    backgroundColor: '#2ecc71' },
          { label: 'Open/Bloqué', data: sprints.map(s => tasks.filter(t => t.sprint === s && t.statut !== 'done').length), backgroundColor: '#4a9eff' }
        ]
      },
      options: { ...chartDefaults,
        scales: {
          x: { stacked: true, ticks: { color: '#ccc' }, grid: { color: '#2a2a4a' } },
          y: { stacked: true, ticks: { color: '#ccc', stepSize: 1 }, grid: { color: '#2a2a4a' } }
        },
        plugins: { ...chartDefaults.plugins,
          title: { display: true, text: 'Tickets par sprint', color: '#ccc', font: { size: 13 } } } }
    });

    // Chart 4 — Barres par priorité
    const prios = ['high', 'medium', 'low'];
    chartInstances.priority = new Chart(document.getElementById('chart-priority'), {
      type: 'bar',
      data: {
        labels: ['High', 'Medium', 'Low'],
        datasets: [
          { label: 'Done',   data: prios.map(p => tasks.filter(t => t['priorité'] === p && t.statut === 'done').length),    backgroundColor: '#2ecc71' },
          { label: 'Open',   data: prios.map(p => tasks.filter(t => t['priorité'] === p && (t.statut === 'open' || t.statut === 'in_progress')).length), backgroundColor: '#f39c12' },
          { label: 'Bloqué', data: prios.map(p => tasks.filter(t => t['priorité'] === p && t.statut === 'blocked').length), backgroundColor: '#e94560' }
        ]
      },
      options: { ...chartDefaults,
        scales: {
          x: { stacked: true, ticks: { color: '#ccc' }, grid: { color: '#2a2a4a' } },
          y: { stacked: true, ticks: { color: '#ccc', stepSize: 1 }, grid: { color: '#2a2a4a' } }
        },
        plugins: { ...chartDefaults.plugins,
          title: { display: true, text: 'Tickets par priorité', color: '#ccc', font: { size: 13 } } } }
    });

    // Chart 5 — Sessions Claude vs OpenCode (barres horizontales par tâche ayant des sessions)
    const sessionTools = ['CL', 'OC'];
    const toolLabels   = { CL: 'Claude (CL)', OC: 'OpenCode (OC)' };
    const toolColors   = { CL: '#fbbf24', OC: '#e94560' };

    // Compter les sessions par outil par tâche, pour construire un dataset par outil
    const tasksWithSessions = tasks.filter(t => t.sessions && t.sessions.length > 0);
    const sessionTaskLabels = tasksWithSessions.map(t => t.id);
    chartInstances.sessions = new Chart(document.getElementById('chart-sessions'), {
      type: 'bar',
      data: {
        labels: sessionTaskLabels.length ? sessionTaskLabels : ['(aucune session)'],
        datasets: sessionTools.map(tool => ({
          label: toolLabels[tool],
          data: sessionTaskLabels.length
            ? tasksWithSessions.map(t => (t.sessions || []).filter(s => s.tool === tool).length)
            : [0],
          backgroundColor: toolColors[tool]
        }))
      },
      options: { ...chartDefaults,
        indexAxis: 'y',
        scales: {
          x: { stacked: true, ticks: { color: '#ccc', stepSize: 1 }, grid: { color: '#2a2a4a' } },
          y: { stacked: true, ticks: { color: '#ccc', font: { family: 'Courier New' } }, grid: { color: '#2a2a4a' } }
        },
        plugins: { ...chartDefaults.plugins,
          title: { display: true, text: `Sessions par ticket — Claude (${clCount}) vs OpenCode (${ocCount})`, color: '#ccc', font: { size: 13 } } } }
    });
  }

  function normalizeIsoDate(raw) {
    if (raw === null || raw === undefined || raw === '' || raw === '~') return null;
    if (raw instanceof Date && !Number.isNaN(raw.getTime())) {
      return raw.toISOString().slice(0, 10);
    }
    const s = String(raw).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const d = new Date(s);
    if (Number.isNaN(d.getTime())) return null;
    return d.toISOString().slice(0, 10);
  }

  function renderTimeline() {
    if (timelineInitialized || !allTasks.length) return;

    // AGENT-DECISION: [spec] — timeline relies on resolved tickets only because tasks have no reliable creation date.
    const doneTasks = allTasks.filter(t => t.statut === 'done');
    const doneByDate = new Map();

    doneTasks.forEach(task => {
      const isoDate = normalizeIsoDate(task.date_resolution);
      if (!isoDate) return;
      doneByDate.set(isoDate, (doneByDate.get(isoDate) || 0) + 1);
    });

    const orderedDates = Array.from(doneByDate.keys()).sort((a, b) => a.localeCompare(b));

    if (!orderedDates.length) {
      viewTimeline.innerHTML = '<div class="state-box"><div class="icon">📈</div><h2>Aucune date de résolution exploitable</h2><p>Renseigner <code>date_resolution</code> sur les tickets <code>done</code> pour afficher la timeline.</p></div>';
      timelineInitialized = true;
      return;
    }

    const dailyResolved = orderedDates.map(d => doneByDate.get(d) || 0);
    let runningTotal = 0;
    const cumulativeDone = orderedDates.map(date => {
      runningTotal += doneByDate.get(date) || 0;
      return runningTotal;
    });

    const labels = orderedDates.map(d => {
      const parts = d.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}` : d;
    });

    const chartDefaults = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#ccc', boxWidth: 12 } } }
    };

    chartInstances.timeline = new Chart(document.getElementById('chart-timeline'), {
      data: {
        labels,
        datasets: [
          {
            type: 'bar',
            label: 'Résolus / jour',
            data: dailyResolved,
            backgroundColor: 'rgba(233,69,96,0.5)',
            borderColor: '#e94560',
            borderWidth: 1,
            yAxisID: 'y'
          },
          {
            type: 'line',
            label: 'Cumul traités',
            data: cumulativeDone,
            borderColor: '#22c55e',
            backgroundColor: '#22c55e',
            pointRadius: 2,
            pointHoverRadius: 4,
            tension: 0.25,
            yAxisID: 'yCumulative'
          }
        ]
      },
      options: {
        ...chartDefaults,
        scales: {
          x: { ticks: { color: '#ccc' }, grid: { color: '#2a2a4a' } },
          y: {
            beginAtZero: true,
            ticks: { color: '#ccc', stepSize: 1 },
            grid: { color: '#2a2a4a' },
            title: { display: true, text: 'Résolus / jour', color: '#ccc' }
          },
          yCumulative: {
            beginAtZero: true,
            position: 'right',
            ticks: { color: '#9be1af', stepSize: 1 },
            grid: { drawOnChartArea: false },
            title: { display: true, text: 'Cumul traités', color: '#9be1af' }
          }
        },
        plugins: {
          ...chartDefaults.plugins,
          title: {
            display: true,
            text: 'Progression temporelle des tickets traités',
            color: '#ccc',
            font: { size: 13 }
          },
          tooltip: {
            callbacks: {
              title(items) {
                const idx = items && items.length ? items[0].dataIndex : 0;
                return orderedDates[idx] || '';
              }
            }
          }
        }
      }
    });

    timelineInitialized = true;
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  function init(tasks) {
    allTasks = Array.isArray(tasks) ? tasks : [];
    populateSelect(fSprint,  uniqueVals(allTasks, 'sprint'));
    populateSelect(fType,    uniqueVals(allTasks, 'type'));
    populateSelect(fAgent,   uniqueVals(allTasks, 'assigned_agent'));
    populateSelect(fFeature,  uniqueVals(allTasks, 'feature'));
    populateSelect(fPriority, uniqueVals(allTasks, 'priorité'));

    [fStatut, fSprint, fType, fAgent, fFeature, fPriority].forEach(el => el.addEventListener('change', applyFilters));
    fSearch.addEventListener('input', applyFilters);
    btnReset.addEventListener('click', () => {
      fStatut.value = ''; fSprint.value = ''; fType.value = '';
      fAgent.value  = ''; fFeature.value = ''; fPriority.value = ''; fSearch.value = '';
      applyFilters();
    });
    applyFilters();
    if (currentTab === 'roadmap') renderRoadmapView();
    if (currentTab === 'stats') renderStats();
    if (currentTab === 'timeline') renderTimeline();
  }

  // ── Error states ───────────────────────────────────────────────────────────
  function showCorsError() {
    mainContent.innerHTML = `
      <div class="state-box">
        <div class="icon">⚠️</div>
        <h2>Impossible de charger les fichiers YAML via <code>file://</code></h2>
        <p>Les navigateurs bloquent les requêtes fetch sur les URLs <code>file://</code>.</p>
        <p>Lancer un serveur local depuis la <strong>racine du repo</strong> :</p>
        <code>npx serve .</code>
        <p style="margin-top:12px">puis ouvrir <strong>http://localhost:&lt;port&gt;/docs/05-Project/tasks-dashboard/</strong></p>
      </div>`;
    cntTotal.textContent = cntOpen.textContent = cntDone.textContent = cntBlocked.textContent = cntRate.textContent = '—';
  }

  function showFetchError(err) {
    mainContent.innerHTML = `
      <div class="state-box">
        <div class="icon">❌</div>
        <h2>Impossible de charger tasks.yaml</h2>
        <p>${escapeHtml(String(err))}</p>
      </div>`;
    cntTotal.textContent = cntOpen.textContent = cntDone.textContent = cntBlocked.textContent = cntRate.textContent = '—';
  }

  // ── Bootstrap — charge tasks + roadmap + archive en parallèle ──────────────
  const tasksPromise = fetch('../tasks.yaml')
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.statusText}`);
      return res.text();
    })
    .then(text => jsyaml.load(text));

  const roadmapPromise = fetch('../roadmap.yaml')
    .then(res => res.ok ? res.text() : null)
    .then(text => text ? jsyaml.load(text) : null)
    .catch(() => null);  // non-bloquant

  const archivePromise = fetch('../tasks-done.yaml')
    .then(res => res.ok ? res.text() : null)
    .then(text => text ? jsyaml.load(text) : null)
    .catch(() => null);  // non-bloquant

  Promise.all([tasksPromise, roadmapPromise, archivePromise])
    .then(([tasksDoc, roadmapDoc, archiveDoc]) => {
      roadmapData = (roadmapDoc && roadmapDoc.sprints) ? roadmapDoc.sprints : [];
      const active  = (tasksDoc  && tasksDoc.tasks)  ? tasksDoc.tasks  : [];
      const archive = (archiveDoc && archiveDoc.tasks) ? archiveDoc.tasks : [];
      init([...active, ...archive]);
    })
    .catch(err => {
      const msg = String(err);
      if (
        location.protocol === 'file:' ||
        msg.includes('Failed to fetch') ||
        msg.includes('NetworkError') ||
        msg.includes('CORS')
      ) {
        showCorsError();
      } else {
        showFetchError(err);
      }
    });

})();
</script>
</body>
</html>
