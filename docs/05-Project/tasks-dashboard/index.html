<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARK — Task Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a2e;
      --bg-card:   #16213e;
      --bg-row:    #0f3460;
      --border:    #2a2a4a;
      --text:      #e0e0e0;
      --text-dim:  #888;
      --text-muted:#555;
      --accent:    #e94560;

      --c-spec:     #3b82f6;
      --c-decision: #8b5cf6;
      --c-review:   #f97316;
      --c-debt:     #ef4444;
      --c-impl:     #22c55e;
      --c-test:     #06b6d4;
      --c-doc:      #6b7280;
      --c-poc:      #eab308;

      --font-mono: 'Courier New', Courier, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
    }
    .header h1 span { color: var(--accent); }

    .counters {
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .counters strong { color: var(--text); font-size: 20px; margin-right: 4px; }

    /* ── Filters ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    .filters label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .filters select,
    .filters input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      min-width: 120px;
    }
    .filters input { min-width: 200px; }
    .filters select:hover,
    .filters input:hover { border-color: #4a4a7a; }
    .filters select:focus,
    .filters input:focus { border-color: var(--accent); }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      align-self: flex-end;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Table ── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }
    thead th {
      background: var(--bg-card);
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    tbody tr.done { opacity: 0.55; }

    td {
      padding: 10px 12px;
      vertical-align: top;
      line-height: 1.5;
    }

    /* ── Status cell ── */
    .status-check {
      font-size: 16px;
      display: block;
      text-align: center;
    }

    /* ── ID cell ── */
    .task-id {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .badge-spec     { background: rgba(59,130,246,0.2);  color: var(--c-spec); }
    .badge-decision { background: rgba(139,92,246,0.2);  color: var(--c-decision); }
    .badge-review   { background: rgba(249,115,22,0.2);  color: var(--c-review); }
    .badge-debt     { background: rgba(239,68,68,0.2);   color: var(--c-debt); }
    .badge-impl     { background: rgba(34,197,94,0.2);   color: var(--c-impl); }
    .badge-test     { background: rgba(6,182,212,0.2);   color: var(--c-test); }
    .badge-doc      { background: rgba(107,114,128,0.2); color: var(--c-doc); }
    .badge-poc      { background: rgba(234,179,8,0.2);   color: var(--c-poc); }

    /* Sprint badges — cycle through neutral-distinct colors */
    .badge-sprint {
      background: rgba(255,255,255,0.08);
      color: #a0a0c0;
      font-family: var(--font-mono);
    }

    /* ── Sessions ── */
    .sessions-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .session-item {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .session-tool {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      margin-right: 4px;
    }
    .tool-OC { background: rgba(233,69,96,0.2); color: var(--accent); }
    .tool-CL { background: rgba(251,191,36,0.2); color: #fbbf24; }

    .session-id { color: var(--text-dim); }
    .session-name { color: var(--text-muted); font-style: italic; }

    /* ── Date ── */
    .date-cell {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ── Notes ── */
    .notes-cell {
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-dim);
      font-size: 13px;
    }

    .dash { color: var(--text-muted); }

    /* ── Empty / Error states ── */
    .state-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      color: var(--text-dim);
    }
    .state-box .icon { font-size: 32px; margin-bottom: 12px; }
    .state-box h2 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
    .state-box code {
      display: inline-block;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--c-impl);
      margin-top: 12px;
    }
    .state-box p { margin-top: 8px; font-size: 13px; line-height: 1.6; }

    .empty-row td {
      text-align: center;
      padding: 32px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Report link ── */
    .btn-report {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .btn-report:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(233,69,96,0.06);
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--text-dim);
      gap: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>ARK <span>Task Dashboard</span></h1>
  <div class="counters" id="counters">
    <div><strong id="cnt-total">—</strong> Total</div>
    <div><strong id="cnt-open">—</strong> Open</div>
    <div><strong id="cnt-done">—</strong> Done</div>
  </div>
  <a href="../../../e2e/reports/html/index.html"
     target="_blank"
     class="btn-report"
     title="Rapport Playwright — make test-api-backend pour le générer, make test-api-report pour l'ouvrir">
    Playwright Report ↗
  </a>
</div>
</div>

<div class="filters">
  <label>
    Statut
    <select id="f-statut">
      <option value="">Tous</option>
      <option value="open">Open</option>
      <option value="done">Done</option>
    </select>
  </label>
  <label>
    Sprint
    <select id="f-sprint"><option value="">Tous</option></select>
  </label>
  <label>
    Type
    <select id="f-type"><option value="">Tous</option></select>
  </label>
  <label>
    Feature
    <select id="f-feature"><option value="">Toutes</option></select>
  </label>
  <label>
    Recherche
    <input type="text" id="f-search" placeholder="nom, notes…" />
  </label>
  <button class="btn-reset" id="btn-reset">Réinitialiser</button>
</div>

<div id="main-content">
  <div class="loading"><div class="spinner"></div> Chargement de tasks.yaml…</div>
</div>

<script>
(function () {
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────────
  let allTasks = [];
  let filtered = [];

  const TYPE_COLORS = {
    spec: 'spec', decision: 'decision', review: 'review', debt: 'debt',
    impl: 'impl', test: 'test', doc: 'doc', poc: 'poc'
  };

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const mainContent  = document.getElementById('main-content');
  const cntTotal     = document.getElementById('cnt-total');
  const cntOpen      = document.getElementById('cnt-open');
  const cntDone      = document.getElementById('cnt-done');
  const fStatut      = document.getElementById('f-statut');
  const fSprint      = document.getElementById('f-sprint');
  const fType        = document.getElementById('f-type');
  const fFeature     = document.getElementById('f-feature');
  const fSearch      = document.getElementById('f-search');
  const btnReset     = document.getElementById('btn-reset');

  // ── Helpers ────────────────────────────────────────────────────────────────
  function dash(val) {
    if (val === null || val === undefined || val === '' || val === '~') {
      return '<span class="dash">—</span>';
    }
    return String(val);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function truncate(str, max) {
    if (!str) return '';
    const s = String(str);
    return s.length > max ? s.slice(0, max) + '…' : s;
  }

  function uniqueVals(arr, key) {
    const set = new Set();
    arr.forEach(t => {
      const v = t[key];
      if (v !== null && v !== undefined && v !== '' && v !== '~') set.add(v);
    });
    return Array.from(set).sort();
  }

  function populateSelect(sel, values) {
    const first = sel.options[0]; // keep "Tous"
    sel.innerHTML = '';
    sel.appendChild(first);
    values.forEach(v => {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      sel.appendChild(o);
    });
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderSessions(sessions) {
    if (!sessions || sessions.length === 0) return '<span class="dash">—</span>';
    return '<div class="sessions-list">' +
      sessions.map(s => {
        const tool = escapeHtml(s.tool || '');
        const id   = escapeHtml(s.id   || '');
        const nom  = escapeHtml(s.nom  || '');
        return `<span class="session-item">` +
          `<span class="session-tool tool-${tool}">${tool}</span>` +
          `<span class="session-id">${id}</span>` +
          (nom ? ` <span class="session-name">"${nom}"</span>` : '') +
          `</span>`;
      }).join('') +
    '</div>';
  }

  function renderRow(task) {
    const isDone    = task.statut === 'done';
    const statusIcon = isDone ? '✅' : '⬜';
    const typeClass  = TYPE_COLORS[task.type] ? `badge badge-${task.type}` : 'badge badge-doc';
    const notes      = escapeHtml(task.notes || '');
    const notesTrunc = escapeHtml(truncate(task.notes, 60));

    const sprintHtml = task.sprint
      ? `<span class="badge badge-sprint">${escapeHtml(task.sprint)}</span>`
      : '<span class="dash">—</span>';

    const typeHtml = task.type
      ? `<span class="${typeClass}">${escapeHtml(task.type)}</span>`
      : '<span class="dash">—</span>';

    return `
      <tr class="${isDone ? 'done' : ''}">
        <td><span class="status-check">${statusIcon}</span></td>
        <td><span class="task-id">${escapeHtml(task.id)}</span></td>
        <td>${escapeHtml(task.nom || '')}</td>
        <td>${sprintHtml}</td>
        <td>${dash(task.theme)}</td>
        <td>${typeHtml}</td>
        <td>${dash(task.feature)}</td>
        <td>${renderSessions(task.sessions)}</td>
        <td><span class="date-cell">${dash(task.date_resolution)}</span></td>
        <td class="notes-cell" title="${notes}">${notesTrunc || '<span class="dash">—</span>'}</td>
      </tr>`;
  }

  function renderTable(tasks) {
    const rows = tasks.length > 0
      ? tasks.map(renderRow).join('')
      : `<tr class="empty-row"><td colspan="10">Aucune tâche ne correspond aux filtres.</td></tr>`;

    return `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Statut</th>
              <th>ID</th>
              <th>Nom</th>
              <th>Sprint</th>
              <th>Thème</th>
              <th>Type</th>
              <th>Feature</th>
              <th>Sessions</th>
              <th>Date résolution</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // ── Counters ───────────────────────────────────────────────────────────────
  function updateCounters(tasks) {
    const total = tasks.length;
    const open  = tasks.filter(t => t.statut === 'open').length;
    const done  = tasks.filter(t => t.statut === 'done').length;
    cntTotal.textContent = total;
    cntOpen.textContent  = open;
    cntDone.textContent  = done;
  }

  // ── Filter logic ───────────────────────────────────────────────────────────
  function applyFilters() {
    const statut  = fStatut.value;
    const sprint  = fSprint.value;
    const type    = fType.value;
    const feature = fFeature.value;
    const search  = fSearch.value.trim().toLowerCase();

    filtered = allTasks.filter(t => {
      if (statut  && t.statut  !== statut)  return false;
      if (sprint  && t.sprint  !== sprint)  return false;
      if (type    && t.type    !== type)    return false;
      if (feature && t.feature !== feature) return false;
      if (search) {
        const haystack = [t.nom, t.notes].join(' ').toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    mainContent.innerHTML = renderTable(filtered);
    updateCounters(filtered);
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  function init(tasks) {
    allTasks = Array.isArray(tasks) ? tasks : [];

    // Populate dynamic selects
    populateSelect(fSprint,  uniqueVals(allTasks, 'sprint'));
    populateSelect(fType,    uniqueVals(allTasks, 'type'));
    populateSelect(fFeature, uniqueVals(allTasks, 'feature'));

    // Wire filters
    [fStatut, fSprint, fType, fFeature].forEach(el => el.addEventListener('change', applyFilters));
    fSearch.addEventListener('input', applyFilters);
    btnReset.addEventListener('click', () => {
      fStatut.value = '';
      fSprint.value = '';
      fType.value   = '';
      fFeature.value = '';
      fSearch.value  = '';
      applyFilters();
    });

    applyFilters();
  }

  // ── Error states ───────────────────────────────────────────────────────────
  function showCorsError() {
    mainContent.innerHTML = `
      <div class="state-box">
        <div class="icon">⚠️</div>
        <h2>Impossible de charger tasks.yaml via <code>file://</code></h2>
        <p>Les navigateurs bloquent les requêtes fetch sur les URLs <code>file://</code> pour des raisons de sécurité.</p>
        <p>Lancer un serveur local depuis la racine du repo :</p>
        <code>npx serve docs/05-Project</code>
        <p style="margin-top:12px">puis ouvrir <strong>http://localhost:3000/tasks-dashboard/</strong></p>
      </div>`;
    cntTotal.textContent = cntOpen.textContent = cntDone.textContent = '—';
  }

  function showParseError(err) {
    mainContent.innerHTML = `
      <div class="state-box">
        <div class="icon">💥</div>
        <h2>Erreur de parsing YAML</h2>
        <p>Le fichier <code>tasks.yaml</code> contient une erreur :</p>
        <code>${escapeHtml(String(err))}</code>
      </div>`;
    cntTotal.textContent = cntOpen.textContent = cntDone.textContent = '—';
  }

  function showFetchError(err) {
    mainContent.innerHTML = `
      <div class="state-box">
        <div class="icon">❌</div>
        <h2>Impossible de charger tasks.yaml</h2>
        <p>${escapeHtml(String(err))}</p>
      </div>`;
    cntTotal.textContent = cntOpen.textContent = cntDone.textContent = '—';
  }

  // ── Bootstrap ──────────────────────────────────────────────────────────────
  fetch('../tasks.yaml')
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.statusText}`);
      return res.text();
    })
    .then(text => {
      let parsed;
      try {
        parsed = jsyaml.load(text);
      } catch (e) {
        showParseError(e);
        return;
      }
      const tasks = (parsed && parsed.tasks) ? parsed.tasks : [];
      init(tasks);
    })
    .catch(err => {
      // Detect CORS / file:// block
      const msg = String(err);
      if (
        location.protocol === 'file:' ||
        msg.includes('Failed to fetch') ||
        msg.includes('NetworkError') ||
        msg.includes('CORS')
      ) {
        showCorsError();
      } else {
        showFetchError(err);
      }
    });

})();
</script>
</body>
</html>
