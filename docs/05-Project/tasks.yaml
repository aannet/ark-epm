    notes: |
      ✅ Implémentation complète (Makefile targets + config ZAP).
      
      Cibles ajoutées au Makefile :
      - make test-dast : scan API actif avec openapi.yaml (recommandé)
      - make test-dast-baseline : scan passif spider uniquement
      - make open-dast-report : ouverture navigateur rapport
      
      Variables configurables :
      - ZAP_IMAGE=ghcr.io/zaproxy/zaproxy:latest
      - ZAP_TARGET=http://backend:3000/api/v1
      - ZAP_OPENAPI=docs/04-Tech/openapi.yaml
      - Seuil : WARN (Medium+) → échec sur vulnérabilités Medium/High
      
      Pattern : docker run --rm (cohérent avec Trivy/Semgrep)
      Network : ark-epm_default (containers Docker)
      Auth : Header Authorization via get-token.sh
      
      Rapports générés : reports/zap/zap-report.html + .json
      
      ⚠️ NOTE ENV : Environnement Docker local actuellement instable
      (erreur I/O daemon). L'implémentation est validée syntaxiquement
      et prête pour exécution sur environnement Docker healthy.
      
       Pour valider : docker-compose up -d && make test-dast

