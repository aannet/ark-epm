<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARK - Test Coverage Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --bg-card: #16213e;
      --bg-row: #0f3460;
      --border: #2a2a4a;
      --text: #e0e0e0;
      --text-dim: #8a8aa7;
      --text-muted: #5f5f7d;
      --accent: #e94560;

      --pass: #22c55e;
      --fail: #ef4444;
      --skip: #64748b;
      --warn: #f59e0b;
      --none: #475569;
      --info: #3b82f6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .header h1 span { color: var(--accent); }

    .meta {
      margin-top: 7px;
      color: var(--text-dim);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta strong { color: var(--text); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill-link {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      text-decoration: none;
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 12px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .pill-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(233, 69, 96, 0.08);
    }

    .kpis {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .kpi {
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: 8px;
      min-width: 110px;
      padding: 9px 12px;
      text-align: right;
    }

    .kpi .label {
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 10px;
      margin-bottom: 3px;
    }

    .kpi .value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .state-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--text-dim);
      text-align: center;
      padding: 30px 22px;
    }

    .state-box h2 {
      color: var(--text);
      margin-bottom: 8px;
      font-size: 17px;
    }

    .state-box p { line-height: 1.6; }

    .framework-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .framework-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .framework-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .framework-title h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
    }

    .status-badge {
      font-size: 10px;
      border-radius: 999px;
      padding: 2px 7px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-ready { background: rgba(34, 197, 94, 0.2); color: var(--pass); }
    .status-not-run { background: rgba(100, 116, 139, 0.23); color: #94a3b8; }

    .framework-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 6px;
      column-gap: 10px;
      font-size: 12px;
    }

    .framework-stats .muted { color: var(--text-dim); }
    .framework-stats .strong { color: var(--text); font-weight: 700; }

    .framework-chart {
      position: relative;
      height: 138px;
    }

    .two-col {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      margin-bottom: 16px;
    }

    .panel-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      padding: 14px;
    }

    .panel-card h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .table-wrapper {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
      background: var(--bg-card);
    }

    table { width: 100%; border-collapse: collapse; min-width: 860px; }

    th {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-size: 11px;
      padding: 10px 12px;
      white-space: nowrap;
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      line-height: 1.5;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.04); }

    .muted { color: var(--text-dim); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

    .metric-ok { color: var(--pass); }
    .metric-warn { color: var(--warn); }
    .metric-bad { color: var(--fail); }

    .chip {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .chip-pass { background: rgba(34, 197, 94, 0.2); color: var(--pass); }
    .chip-fail { background: rgba(239, 68, 68, 0.2); color: var(--fail); }
    .chip-partial { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
    .chip-not-run { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
    .chip-none { background: rgba(71, 85, 105, 0.2); color: #94a3b8; }
    .chip-unknown { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }

    .framework-chip-jest_unit { background: rgba(59, 130, 246, 0.18); color: #60a5fa; }
    .framework-chip-jest_e2e { background: rgba(147, 51, 234, 0.2); color: #c084fc; }
    .framework-chip-playwright_api,
    .framework-chip-playwright_ui { background: rgba(34, 197, 94, 0.18); color: #86efac; }
    .framework-chip-cypress { background: rgba(6, 182, 212, 0.2); color: #67e8f9; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .filters select,
    .filters input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      min-width: 140px;
      outline: none;
    }

    .filters input { min-width: 240px; }
    .filters select:focus,
    .filters input:focus { border-color: var(--accent); }

    .small-note {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 12px;
    }

    @media (max-width: 1240px) {
      .framework-grid { grid-template-columns: repeat(3, minmax(180px, 1fr)); }
      .two-col { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      body { padding: 16px; }
      .header { flex-direction: column; }
      .header-actions { justify-content: flex-start; }
      .kpis { justify-content: flex-start; }
      .framework-grid { grid-template-columns: 1fr; }
      .filters input { min-width: 100%; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div>
      <h1>ARK <span>Test Coverage</span> Dashboard</h1>
      <div class="meta" id="metaInfo"></div>
    </div>
    <div class="header-actions">
      <a class="pill-link" href="../tasks-dashboard/" target="_blank" rel="noopener noreferrer">Tasks Dashboard</a>
      <a class="pill-link" href="../../../e2e/reports/html/index.html" target="_blank" rel="noopener noreferrer">Playwright Report</a>
      <div class="kpis">
        <div class="kpi">
          <div class="label">Tests</div>
          <div class="value" id="kpiTests">--</div>
        </div>
        <div class="kpi">
          <div class="label">Pass rate</div>
          <div class="value" id="kpiPassRate">--</div>
        </div>
        <div class="kpi">
          <div class="label">Coverage lines</div>
          <div class="value" id="kpiCoverage">--</div>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="overview">Vue globale</button>
    <button class="tab-btn" data-tab="coverage">Code coverage</button>
    <button class="tab-btn" data-tab="features">Par feature</button>
    <button class="tab-btn" data-tab="inventory">Inventaire</button>
  </nav>

  <main id="content">
    <div class="state-box" id="loadingBox">
      <h2>Chargement des donnees</h2>
      <p>Lecture de <code>coverage-data.json</code>...</p>
    </div>

    <section id="tab-overview" class="tab-panel"></section>
    <section id="tab-coverage" class="tab-panel"></section>
    <section id="tab-features" class="tab-panel"></section>
    <section id="tab-inventory" class="tab-panel"></section>
  </main>

  <script>
    const FRAMEWORK_ORDER = [
      'jest_unit',
      'jest_e2e',
      'playwright_api',
      'playwright_ui',
      'cypress',
    ];
    const FRAMEWORK_LABELS = {
      jest_unit: 'Jest unit',
      jest_e2e: 'Jest e2e',
      cypress: 'Cypress',
      playwright_api: 'Playwright API',
      playwright_ui: 'Playwright UI',
    };

    const chartRegistry = new Map();
    let dashboardData = null;
    let inventoryFilters = { framework: 'all', feature: 'all', search: '' };

    function formatInt(value) {
      if (value == null || Number.isNaN(Number(value))) {
        return '--';
      }
      return Number(value).toLocaleString('fr-FR');
    }

    function formatPct(value) {
      if (value == null || Number.isNaN(Number(value))) {
        return '--';
      }
      return `${Number(value).toFixed(1)}%`;
    }

    function dateLabel(value) {
      if (!value) {
        return 'non execute';
      }
      try {
        return new Date(value).toLocaleString('fr-FR', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit',
        });
      } catch {
        return value;
      }
    }

    function valueTone(value) {
      if (value == null) return '';
      if (value < 60) return 'metric-bad';
      if (value < 80) return 'metric-warn';
      return 'metric-ok';
    }

    function statusChipClass(status) {
      if (status === 'pass') return 'chip chip-pass';
      if (status === 'fail') return 'chip chip-fail';
      if (status === 'partial') return 'chip chip-partial';
      if (status === 'none') return 'chip chip-none';
      if (status === 'not_run') return 'chip chip-not-run';
      return 'chip chip-unknown';
    }

    function statusLabel(status) {
      if (status === 'pass') return 'pass';
      if (status === 'fail') return 'fail';
      if (status === 'partial') return 'partial';
      if (status === 'none') return 'none';
      if (status === 'not_run') return 'not run';
      return 'unknown';
    }

    function ensureTabVisibility(tabId) {
      document.querySelectorAll('.tab-btn').forEach((button) => {
        button.classList.toggle('active', button.dataset.tab === tabId);
      });
      document.querySelectorAll('.tab-panel').forEach((panel) => {
        panel.classList.toggle('active', panel.id === `tab-${tabId}`);
      });
    }

    function clearCharts() {
      chartRegistry.forEach((chart) => chart.destroy());
      chartRegistry.clear();
    }

    function mountDoughnut(canvasId, stats) {
      const canvas = document.getElementById(canvasId);
      if (!canvas || stats.total == null || stats.total === 0) {
        return;
      }
      const chart = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels: ['Pass', 'Fail', 'Skipped'],
          datasets: [{
            data: [stats.pass || 0, stats.fail || 0, stats.skipped || 0],
            backgroundColor: ['#22c55e', '#ef4444', '#64748b'],
            borderWidth: 0,
          }],
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label(context) {
                  return `${context.label}: ${context.raw}`;
                },
              },
            },
          },
          cutout: '66%',
        },
      });
      chartRegistry.set(canvasId, chart);
    }

    function mountCoverageChart(modules) {
      const canvas = document.getElementById('coverageModulesChart');
      if (!canvas || !modules.length) {
        return;
      }

      const focus = modules.slice(0, 14);
      const chart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: focus.map((entry) => entry.module.replace('backend/src/', '')),
          datasets: [{
            label: 'Lines %',
            data: focus.map((entry) => Number(entry.lines ?? 0).toFixed(1)),
            backgroundColor: focus.map((entry) => {
              const value = Number(entry.lines ?? 0);
              if (value < 60) return '#ef4444';
              if (value < 80) return '#f59e0b';
              return '#22c55e';
            }),
            borderWidth: 0,
          }],
        },
        options: {
          indexAxis: 'y',
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
          },
          scales: {
            x: {
              min: 0,
              max: 100,
              ticks: { color: '#8a8aa7' },
              grid: { color: 'rgba(255,255,255,0.08)' },
            },
            y: {
              ticks: { color: '#c7c7d9', font: { size: 11 } },
              grid: { display: false },
            },
          },
        },
      });
      chartRegistry.set('coverageModulesChart', chart);
    }

    function renderMeta() {
      const meta = document.getElementById('metaInfo');
      const sources = dashboardData.sources || {};
      const sourceCount = Object.values(sources).filter((entry) => entry && entry.found).length;
      meta.innerHTML = [
        `<span><strong>Generation:</strong> ${dateLabel(dashboardData.generated_at)}</span>`,
        `<span><strong>Sources detectees:</strong> ${sourceCount}/${Object.keys(sources).length}</span>`,
      ].join('');
    }

    function renderGlobalKpis() {
      document.getElementById('kpiTests').textContent = formatInt(dashboardData.totals?.tests);
      document.getElementById('kpiPassRate').textContent = formatPct(dashboardData.totals?.pass_rate);
      document.getElementById('kpiCoverage').textContent = formatPct(dashboardData.code_coverage?.total?.lines);
    }

    function renderOverview() {
      const panel = document.getElementById('tab-overview');
      const frameworks = dashboardData.frameworks || {};

      const cards = FRAMEWORK_ORDER.map((frameworkId) => {
        const entry = frameworks[frameworkId] || {};
        const title = entry.label || FRAMEWORK_LABELS[frameworkId] || frameworkId;
        return `
          <article class="framework-card">
            <div class="framework-title">
              <h3>${title}</h3>
              <span class="status-badge status-${entry.status === 'ready' ? 'ready' : 'not-run'}">${entry.status === 'ready' ? 'ready' : 'not run'}</span>
            </div>
            <div class="framework-stats">
              <span class="muted">Tests</span><span class="strong">${formatInt(entry.total)}</span>
              <span class="muted">Pass</span><span class="strong metric-ok">${formatInt(entry.pass)}</span>
              <span class="muted">Fail</span><span class="strong metric-bad">${formatInt(entry.fail)}</span>
              <span class="muted">Skipped</span><span class="strong muted">${formatInt(entry.skipped)}</span>
              <span class="muted">Pass rate</span><span class="strong">${formatPct(entry.pass_rate)}</span>
              <span class="muted">Files</span><span class="strong">${formatInt(entry.file_count)}</span>
            </div>
            <div class="framework-chart">
              <canvas id="frameworkChart-${frameworkId}"></canvas>
            </div>
            <div class="small-note">Derniere execution: ${dateLabel(entry.last_run)}</div>
          </article>
        `;
      }).join('');

      panel.innerHTML = `
        <div class="framework-grid">${cards}</div>
        <div class="two-col">
          <section class="panel-card">
            <h3>Coverage policy</h3>
            <p class="muted">Seuils utilises dans le dashboard:</p>
            <table>
              <thead>
                <tr><th>Niveau</th><th>Condition</th><th>Interpretation</th></tr>
              </thead>
              <tbody>
                <tr><td><span class="chip chip-pass">good</span></td><td>>= 80%</td><td>zone cible</td></tr>
                <tr><td><span class="chip chip-partial">warn</span></td><td>60% - 79.9%</td><td>amelioration recommandee</td></tr>
                <tr><td><span class="chip chip-fail">risk</span></td><td>&lt; 60%</td><td>priorite de durcissement</td></tr>
              </tbody>
            </table>
          </section>
          <section class="panel-card">
            <h3>Data sources</h3>
            <table>
              <thead><tr><th>Source</th><th>Path</th><th>Etat</th></tr></thead>
              <tbody>
                ${Object.entries(dashboardData.sources || {}).map(([name, source]) => `
                  <tr>
                    <td class="mono">${name}</td>
                    <td class="mono muted">${source.path}</td>
                    <td>${source.found ? '<span class="chip chip-pass">found</span>' : '<span class="chip chip-not-run">missing</span>'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </section>
        </div>
      `;

      FRAMEWORK_ORDER.forEach((frameworkId) => {
        mountDoughnut(`frameworkChart-${frameworkId}`, frameworks[frameworkId] || {});
      });
    }

    function renderCoverage() {
      const panel = document.getElementById('tab-coverage');
      const coverage = dashboardData.code_coverage || {};
      const modules = Array.isArray(coverage.modules) ? coverage.modules : [];

      if (!modules.length) {
        panel.innerHTML = `
          <div class="state-box">
            <h2>Aucune mesure de code coverage</h2>
            <p>Lance <code>make coverage-report</code> pour generer <code>coverage/coverage-summary.json</code>.</p>
          </div>
        `;
        return;
      }

      panel.innerHTML = `
        <div class="two-col">
          <section class="panel-card">
            <h3>Coverage global (Jest unit)</h3>
            <table>
              <thead>
                <tr><th>Metric</th><th>Value</th></tr>
              </thead>
              <tbody>
                <tr><td>Lines</td><td class="${valueTone(coverage.total?.lines)}"><strong>${formatPct(coverage.total?.lines)}</strong></td></tr>
                <tr><td>Branches</td><td class="${valueTone(coverage.total?.branches)}"><strong>${formatPct(coverage.total?.branches)}</strong></td></tr>
                <tr><td>Functions</td><td class="${valueTone(coverage.total?.functions)}"><strong>${formatPct(coverage.total?.functions)}</strong></td></tr>
                <tr><td>Statements</td><td class="${valueTone(coverage.total?.statements)}"><strong>${formatPct(coverage.total?.statements)}</strong></td></tr>
              </tbody>
            </table>
          </section>
          <section class="panel-card">
            <h3>Modules les plus faibles</h3>
            <div style="height: 280px;"><canvas id="coverageModulesChart"></canvas></div>
          </section>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Module</th>
                <th>Lines</th>
                <th>Branches</th>
                <th>Functions</th>
                <th>Statements</th>
              </tr>
            </thead>
            <tbody>
              ${modules.map((entry) => `
                <tr>
                  <td class="mono">${entry.module}</td>
                  <td class="${valueTone(entry.lines)}">${formatPct(entry.lines)}</td>
                  <td class="${valueTone(entry.branches)}">${formatPct(entry.branches)}</td>
                  <td class="${valueTone(entry.functions)}">${formatPct(entry.functions)}</td>
                  <td class="${valueTone(entry.statements)}">${formatPct(entry.statements)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      mountCoverageChart(modules);
    }

    function renderFeatures() {
      const panel = document.getElementById('tab-features');
      const rows = Array.isArray(dashboardData.features) ? dashboardData.features : [];

      if (!rows.length) {
        panel.innerHTML = `
          <div class="state-box">
            <h2>Aucune donnee feature</h2>
            <p>Le mapping est base sur le prefixe <code>FS-XX</code>, sinon la categorie est <code>Core/Infra</code>.</p>
          </div>
        `;
        return;
      }

      panel.innerHTML = `
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Feature</th>
                <th>Jest unit</th>
                <th>Jest e2e</th>
                <th>Playwright</th>
                <th>Cypress</th>
                <th>Files</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => {
                const fileCount =
                  (row.totals?.jest_unit?.files || 0) +
                  (row.totals?.jest_e2e?.files || 0) +
                  (row.totals?.playwright?.files || 0) +
                  (row.totals?.cypress?.files || 0);

                return `
                  <tr>
                    <td class="mono"><strong>${row.feature}</strong></td>
                    <td><span class="${statusChipClass(row.frameworks?.jest_unit)}">${statusLabel(row.frameworks?.jest_unit)}</span></td>
                    <td><span class="${statusChipClass(row.frameworks?.jest_e2e)}">${statusLabel(row.frameworks?.jest_e2e)}</span></td>
                    <td><span class="${statusChipClass(row.frameworks?.playwright)}">${statusLabel(row.frameworks?.playwright)}</span></td>
                    <td><span class="${statusChipClass(row.frameworks?.cypress)}">${statusLabel(row.frameworks?.cypress)}</span></td>
                    <td class="mono">${fileCount}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
        <p class="small-note">Core/Infra regroupe les tests sans prefixe FS-XX.</p>
      `;
    }

    function renderInventoryTable() {
      const tbody = document.getElementById('inventoryTableBody');
      if (!tbody) {
        return;
      }

      const searchValue = inventoryFilters.search.trim().toLowerCase();
      const rows = (dashboardData.test_files || []).filter((entry) => {
        if (inventoryFilters.framework !== 'all' && entry.framework !== inventoryFilters.framework) {
          return false;
        }
        if (inventoryFilters.feature !== 'all' && entry.feature !== inventoryFilters.feature) {
          return false;
        }
        if (!searchValue) {
          return true;
        }
        return entry.file.toLowerCase().includes(searchValue);
      });

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="muted">Aucun fichier correspondant aux filtres.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map((entry) => `
        <tr>
          <td class="mono">${entry.file}</td>
          <td><span class="chip framework-chip-${entry.framework}">${FRAMEWORK_LABELS[entry.framework] || entry.framework}</span></td>
          <td class="mono">${entry.feature}</td>
          <td class="mono">${formatInt(entry.total)}</td>
          <td class="mono metric-ok">${formatInt(entry.pass)}</td>
          <td class="mono metric-bad">${formatInt(entry.fail)}</td>
          <td class="mono muted">${formatInt(entry.skipped)}</td>
          <td><span class="${statusChipClass(entry.status)}">${statusLabel(entry.status)}</span></td>
        </tr>
      `).join('');
    }

    function renderInventory() {
      const panel = document.getElementById('tab-inventory');
      const testFiles = Array.isArray(dashboardData.test_files) ? dashboardData.test_files : [];

      const frameworkOptions = [...new Set(testFiles.map((entry) => entry.framework))].sort();
      const featureOptions = [...new Set(testFiles.map((entry) => entry.feature))].sort((a, b) => {
        if (a === 'Core/Infra') return 1;
        if (b === 'Core/Infra') return -1;
        return a.localeCompare(b);
      });

      panel.innerHTML = `
        <div class="filters">
          <select id="inventoryFrameworkFilter">
            <option value="all">Framework: all</option>
            ${frameworkOptions.map((framework) => `
              <option value="${framework}">${FRAMEWORK_LABELS[framework] || framework}</option>
            `).join('')}
          </select>
          <select id="inventoryFeatureFilter">
            <option value="all">Feature: all</option>
            ${featureOptions.map((feature) => `<option value="${feature}">${feature}</option>`).join('')}
          </select>
          <input id="inventorySearchFilter" type="search" placeholder="Search path..." />
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>File</th>
                <th>Framework</th>
                <th>Feature</th>
                <th>Tests</th>
                <th>Pass</th>
                <th>Fail</th>
                <th>Skipped</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody"></tbody>
          </table>
        </div>
      `;

      document.getElementById('inventoryFrameworkFilter').addEventListener('change', (event) => {
        inventoryFilters.framework = event.target.value;
        renderInventoryTable();
      });
      document.getElementById('inventoryFeatureFilter').addEventListener('change', (event) => {
        inventoryFilters.feature = event.target.value;
        renderInventoryTable();
      });
      document.getElementById('inventorySearchFilter').addEventListener('input', (event) => {
        inventoryFilters.search = event.target.value;
        renderInventoryTable();
      });

      renderInventoryTable();
    }

    function renderAllTabs() {
      clearCharts();
      renderMeta();
      renderGlobalKpis();
      renderOverview();
      renderCoverage();
      renderFeatures();
      renderInventory();
      ensureTabVisibility('overview');
    }

    async function loadData() {
      const loading = document.getElementById('loadingBox');
      try {
        const response = await fetch('./coverage-data.json');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        dashboardData = await response.json();
        loading.style.display = 'none';
        renderAllTabs();
      } catch (error) {
        loading.innerHTML = `
          <h2>Impossible de charger coverage-data.json</h2>
          <p>Execute <code>make coverage-report</code> depuis la racine, puis recharge la page.</p>
          <p class="small-note">Detail: ${error.message}</p>
        `;
      }
    }

    document.querySelectorAll('.tab-btn').forEach((button) => {
      button.addEventListener('click', () => {
        ensureTabVisibility(button.dataset.tab);
      });
    });

    // AGENT-DECISION: arch - Keep dashboard static (single JSON fetch) to stay consistent with tasks-dashboard usage.
    loadData();
  </script>
</body>
</html>
