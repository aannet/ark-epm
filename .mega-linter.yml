# MegaLinter — Code quality evaluation for ARK-EPM
# Objective: evaluate quality of code produced in backend/src and frontend/src
# See all available variables: https://megalinter.io/latest/config-file/

# General settings
APPLY_FIXES: none
DISABLE_ERRORS: false
PRINT_ALPACA: false
SHOW_ELAPSED_TIME: true
FLAVOR_SUGGESTIONS: false
VALIDATE_ALL_CODEBASE: true

# Pre-commands: install custom ESLint plugins before linting
# sonarjs@1.0.4 is the last version supporting ESLint v8 legacy config format
# (sonarjs v4+ requires ESLint v9 flat config only)
PRE_COMMANDS:
  - command: bash -c "cd /node-deps && npm install eslint-plugin-sonarjs@1.0.4 2>/dev/null || true"
    cwd: workspace
    continue_if_failed: false

# --- Quality linters (primary objective) ---
# ENABLE_LINTERS = whitelist by linter name (vs ENABLE = whitelist by descriptor family)
ENABLE_LINTERS:
  - TYPESCRIPT_ES       # ESLint: bugs, anti-patterns, type-safety (backend/src)
  - COPYPASTE_JSCPD     # Duplicate code detection (backend/src + frontend/src)
  - DOCKERFILE_HADOLINT # Dockerfile best practices

# TYPESCRIPT_ES: project uses ESLint v9 flat config (eslint.config.mjs in backend/)
# TYPESCRIPT_ES_CONFIG_FILE bypasses MegaLinter's activation check for legacy .eslintrc files
TYPESCRIPT_ES_CONFIG_FILE: backend/.eslintrc.cjs
TYPESCRIPT_ES_DIRECTORY: backend
# Note: .eslintrc.cjs = legacy config for MegaLinter (ESLint v8)
# Local dev uses eslint.config.mjs (ESLint v9 flat config) — not affected
# TODO: frontend/src TypeScript requires adding ESLint packages to frontend/package.json

# COPYPASTE_JSCPD: runs in project mode — scoping via .jscpd.json (ignore patterns)
# Findings are informational — duplication does not block the run
COPYPASTE_JSCPD_DISABLE_ERRORS: true

# Files exclusions
FILTER_REGEX_EXCLUDE: '(node_modules/|dist/|build/|\.git/|reports/|prisma/migrations/|.*\.generated\.ts|backend/scripts/get-token\.sh|e2e/reports/|coverage/|\.next/|out/|frontend/cypress/|test-results/|playwright-report/)'

# Additional settings
FILEIO_REPORTER: false
