# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/latest/config-file/
# and all linters at https://megalinter.io/latest/supported-linters/

# General settings
APPLY_FIXES: none
DISABLE_ERRORS: false
PRINT_ALPACA: false
SHOW_ELAPSED_TIME: true
FLAVOR_SUGGESTIONS: false
VALIDATE_ALL_CODEBASE: true

# Report settings (overridden by Makefile via env var REPORT_OUTPUT_FOLDER)
REPORT_OUTPUT_FOLDER: megalinter-reports
REPORTERS:
  - HTML
  - JSON

# Activate only the linters relevant to ARK-EPM stack
ENABLE:
  - TYPESCRIPT_ES
  - MARKDOWN_MARKDOWNLINT
  - JSON_JSONLINT
  - JSON_PRETTIER
  - YAML_YAMLLINT
  - YAML_PRETTIER
  - DOCKERFILE_HADOLINT
  - SQL_SQLFLUFF
  - ENV_DOTENV_LINTER

# Files exclusions — monolithic regex string in single quotes
# In YAML single quotes, backslash is literal (no escaping)
FILTER_REGEX_EXCLUDE: '(node_modules/|dist/|build/|\.git/|reports/|prisma/migrations/|.*\.generated\.ts|backend/scripts/get-token\.sh|e2e/reports/|coverage/|\.next/|out/|frontend/cypress/|test-results/|playwright-report/)'

# Additional settings
FILEIO_REPORTER: false
